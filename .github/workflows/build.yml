name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ['26.2', '26.3']
    name: Build (MC ${{ matrix.mc }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build -Pmc_target=${{ matrix.mc }} --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: lightskies-utils-mc${{ matrix.mc }}
          path: build/libs/*.jar
